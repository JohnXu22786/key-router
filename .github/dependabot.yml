# Dependabot keeps Go, npm and GitHub Actions dependencies up to date.
#
# Version updates are grouped so the weekly schedule produces at most one PR
# per ecosystem (minor+patch together); breaking major bumps arrive as
# individual PRs for manual review. The CI workflow rebuilds and commits
# web/dist on dependabot PRs, so their checks stay green.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-deps:
        patterns: ["*"]
