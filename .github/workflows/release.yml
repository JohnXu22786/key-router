name: Release

# Automatically bumps the patch version and publishes a GitHub Release with
# native builds for Windows, macOS and Linux whenever code changes land on
# main. Builds run on each platform's own runner because the WebView2 /
# WKWebView / WebKit2GTK bindings are cgo-based and cannot be cross-compiled.
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/src/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            tag="v0.1.0"
          else
            base=${latest#v}
            IFS='.' read -r maj min pat <<< "$base"
            tag="v${maj}.${min}.$((pat + 1))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest:-<none>} -> new tag: $tag"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    name: Build ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            asset: LocalRouter-${{ needs.version.outputs.tag }}-windows-amd64.exe
          - name: macOS amd64
            os: macos-latest
            asset: LocalRouter-${{ needs.version.outputs.tag }}-darwin-amd64
          - name: Linux amd64
            os: ubuntu-22.04
            asset: LocalRouter-${{ needs.version.outputs.tag }}-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev

      - name: Add MSYS2 MinGW to PATH (Windows cgo)
        if: runner.os == 'Windows'
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ needs.version.outputs.tag }} -X local-router/handler.version=${{ needs.version.outputs.tag }}" -o ${{ matrix.asset }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: LocalRouter ${{ needs.version.outputs.tag }}
          body: |
            ## LocalRouter ${{ needs.version.outputs.tag }}

            Automated release — built from `main`.

            ### Downloads
            - **Windows**: `LocalRouter-${{ needs.version.outputs.tag }}-windows-amd64.exe`
            - **macOS**: `LocalRouter-${{ needs.version.outputs.tag }}-darwin-amd64`
            - **Linux**: `LocalRouter-${{ needs.version.outputs.tag }}-linux-amd64`

            LocalRouter is licensed under the [GNU Affero General Public License v3.0](https://www.gnu.org/licenses/agpl-3.0.html).
          files: artifacts/**
          generate_release_notes: true
