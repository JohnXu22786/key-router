name: Rebuild Old Release Assets

# TEMPORARY helper to rebuild assets for historical releases whose binaries
# were accidentally deleted on 2026-08-10. Trigger manually with the tag name
# (e.g. v0.1.4); builds the raw binaries for all platforms from that tag and
# uploads them to the existing release, named with the current KeyRouter
# convention. Delete this workflow once all tags are rebuilt.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rebuild (e.g. v0.1.4)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rebuild-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows amd64
            os: windows-latest
            asset: KeyRouter-${{ inputs.tag }}-windows-amd64.exe
          - name: macOS arm64
            os: macos-latest
            asset: KeyRouter-${{ inputs.tag }}-darwin-arm64
          - name: macOS amd64 (Intel)
            os: macos-15-intel
            asset: KeyRouter-${{ inputs.tag }}-darwin-amd64
          - name: Linux amd64
            os: ubuntu-22.04
            asset: KeyRouter-${{ inputs.tag }}-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        if: hashFiles('web/package.json') != ''
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev

      - name: Add MSYS2 MinGW to PATH (Windows cgo)
        if: runner.os == 'Windows'
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Historical tags used the local-router module path; the version is
      # injected numeric so the window title formats it once (no "vv").
      - name: Build binary
        run: |
          ver="${{ inputs.tag }}"
          ver="${ver#v}"
          go build -trimpath -ldflags "-s -w -X main.version=${ver} -X local-router/handler.version=${ver}" -o ${{ matrix.asset }} .

      - name: Upload to release
        run: gh release upload "${{ inputs.tag }}" "${{ matrix.asset }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
