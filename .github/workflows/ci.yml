name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate release version workflow
        run: bash scripts/test-validate-release-version.sh

      - name: Verify release builds use the resolved tag commit
        run: bash scripts/test-release-build-uses-tag-commit.sh

      # web/dist is not committed (content-hashed filenames made every
      # frontend change collide in merges) — build it before compiling so
      # //go:embed web/dist/* resolves.
      - name: Build web UI
        run: |
          npm ci
          npm run build
          npm test
        working-directory: web

      - name: Install WebKit/GTK dependencies (cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Format check
        run: |
          gofmt -l . | tee /dev/stderr
          test -z "$(gofmt -l .)"

  platform-fallback:
    name: Fallback security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Windows fallback ACL tests
        if: runner.os == 'Windows'
        run: go test -run 'TestResolveDataDir|TestFallbackUserComponent|TestTempFallback|TestWindowsFallback' datadir.go datadir_windows.go datadir_test.go datadir_windows_test.go

      - name: macOS fallback ACL tests
        if: runner.os == 'macOS'
        run: go test -run 'TestResolveDataDir|TestFallbackUserComponent|TestTempFallback|TestDarwinFallback' datadir.go datadir_darwin.go datadir_test.go datadir_darwin_test.go

# No separate web job: the go job above already runs `npm run build` (which
# includes the tsc type-check) before compiling, so a web-only job would
# duplicate the exact same steps.
