name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install WebKit/GTK dependencies (cgo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Format check
        run: |
          gofmt -l . | tee /dev/stderr
          test -z "$(gofmt -l .)"

  web:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Type-check and build
        run: npm run build
        working-directory: web

      - name: Verify committed dist is up to date
        run: |
          git diff --exit-code -- web/dist || (echo "web/dist is out of date — run 'cd web && npm run build' and commit the result" && exit 1)
