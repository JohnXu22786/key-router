<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f3d"/>
      <stop offset="1" stop-color="#3d5afe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg1)"/>

  <!-- Key head -->
  <circle cx="76" cy="128" r="34" fill="none" stroke="#ffffff" stroke-width="14"/>

  <!-- Key shaft -->
  <rect x="104" y="119" width="42" height="18" fill="#ffffff"/>

  <!-- Key teeth -->
  <rect x="118" y="137" width="10" height="16" fill="#ffffff"/>
  <rect x="134" y="137" width="10" height="22" fill="#ffffff"/>

  <!-- Top route -->
  <path d="M146 128 L172 128 L172 84 L198 84" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Middle route: continuous solid line -->
