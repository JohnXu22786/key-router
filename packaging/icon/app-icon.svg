  <!-- Bottom route -->
  <path d="M146 128 L172 128 L172 172 L198 172" fill="none" stroke="#f87171" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Active route signal rings -->
  <circle cx="206" cy="84" r="17" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.35"/>
  <circle cx="206" cy="84" r="22" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.18"/>

  <!-- Route endpoints -->
  <circle cx="206" cy="84" r="9" fill="#22c55e"/>
  <circle cx="206" cy="128" r="9" fill="#facc15"/>
  <circle cx="206" cy="172" r="9" fill="#f87171" opacity="0.85"/>
</svg>
